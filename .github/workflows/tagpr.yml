name: Tagpr

on:
  push:
    branches:
      - main

jobs:
  tagpr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5.1.0
        with:
          # tagprが直前リリースタグを判定するため全履歴・タグが必要
          fetch-depth: 0
          persist-credentials: false

      - name: Run tagpr
        uses: Songmu/tagpr@v1.21.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
