name: Publish TUI screenshot (temporary)

on:
  push:
    branches:
      - feat/bubble-tea-tui

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fetch captured TUI image
        uses: actions/download-artifact@v4
        with:
          name: nippo-tui-real-screenshot
          run-id: 41048065434
          repository: nurazon59/nippo
          github-token: ${{ github.token }}
          path: docs/images
      - name: Commit screenshot to PR branch
        run: |
          set -euo pipefail
          test -s docs/images/nippo-tui-real.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/nippo-tui-real.png
          git commit -m "docs(tui): 実行環境のスクリーンショットを追加"
          git push origin HEAD:feat/bubble-tea-tui
