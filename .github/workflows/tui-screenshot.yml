name: TUI Screenshot

on:
  push:
    branches:
      - feat/bubble-tea-tui

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          install: true
      - name: Install screenshot utilities
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xterm scrot fonts-noto-cjk
      - name: Compile and capture actual TUI
        shell: bash
        run: |
          set -euo pipefail
          go build -o /tmp/nippo .
          mkdir -p "$RUNNER_TEMP/tui-data/nippo/2026/10"
          cat > "$RUNNER_TEMP/tui-config.yaml" <<EOF
          version: 1
          storage_dir: $RUNNER_TEMP/tui-data
          EOF
          cat > "$RUNNER_TEMP/tui-data/nippo/2026/10/30.md" <<'EOF'
          # 2026-10-30

          ## やった
          - OAuth / OIDC の認証フローを調査
          - Go のコードレビュー
          - CI の改善

          ## やる
          - IdP の設計を更新
          - Passkey の検証

          ## 所感
          Bubble Tea で日報を一覧表示できるようになった。
          EOF
          cat > "$RUNNER_TEMP/tui-data/nippo/2026/10/29.md" <<'EOF'
          # 2026-10-29
          ## やった
          - 仕様確認
          EOF
          cat > "$RUNNER_TEMP/tui-data/nippo/2026/10/28.md" <<'EOF'
          # 2026-10-28
          ## やった
          - 日報データ整理
          EOF
          export NIPPO_CONFIG="$RUNNER_TEMP/tui-config.yaml"
          export LANG=C.UTF-8
          xvfb-run -a -s "-screen 0 1500x900x24" bash -c '
            set -e
            xterm -fa "Noto Sans Mono CJK JP" -fs 14 -geometry 105x29+35+35 -T "nippo real TUI" -bg "#141821" -fg "#eceff4" -e /tmp/nippo tui &
            term_pid=$!
            sleep 7
            scrot -o "$GITHUB_WORKSPACE/nippo-tui-real.png"
            kill "$term_pid" || true
          '
          test -s nippo-tui-real.png
      - uses: actions/upload-artifact@v4
        with:
          name: nippo-tui-real-screenshot
          path: nippo-tui-real.png
          retention-days: 7
